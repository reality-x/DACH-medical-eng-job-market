name: pipeline

# Daily: query Adzuna, classify, aggregate, commit docs/data/*.json.
# GitHub Pages serves docs/ and picks up the new data from the commit.
#
# Setup (Settings -> Secrets and variables -> Actions):
#   secrets    ADZUNA_APP_ID, ADZUNA_APP_KEY
#   variables  PIPELINE_ENABLED = true   turns the daily schedule on
#              CALL_BUDGET      = 160    optional, API calls per run
#
# The schedule is a no-op until PIPELINE_ENABLED is set, so a fork or an
# account still on Adzuna's 25-call trial does not burn calls by accident.

on:
  schedule:
    - cron: "0 6 * * *"        # 06:00 UTC, before the freshness check
  workflow_dispatch:
    inputs:
      call_budget:
        description: "Max Adzuna API calls for this run"
        default: "160"

permissions:
  contents: write

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  run:
    if: github.event_name == 'workflow_dispatch' || vars.PIPELINE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Tests
        run: |
          pip install pytest==8.2.0
          pytest tests/ -q

      - name: Run pipeline
        env:
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          CALL_BUDGET: ${{ inputs.call_budget || vars.CALL_BUDGET || '160' }}
        run: python src/pipeline.py

      - name: Keep raw API responses for a week
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raw-${{ github.run_id }}
          path: .cache/raw
          retention-days: 7
          if-no-files-found: ignore

      - name: Commit data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data state
          if git diff --cached --quiet; then
            echo "no changes"; exit 0
          fi
          git commit -m "data refresh $(date -u +%F)"
          git pull --rebase
          git push
