name: pipeline

# Rebuilds docs/data/*.json for the Regulatory Affairs / MedTech /
# Digital Health tracker from our own Adzuna queries.
#
# The fetched postings are stored in state/postings_snapshot.json.
#   - Manual run (Actions -> pipeline -> Run workflow): default budget 25
#     calls refreshes the snapshot (8 searches x 2 countries = 16 calls
#     for page 1, the rest goes to page 2).
#   - Daily schedule: budget comes from the repo variable
#     DAILY_CALL_BUDGET (default 0 = rebuild from the stored snapshot,
#     ages moved forward, no API use). Set it to e.g. 25 if your Adzuna
#     plan allows a daily refresh.
#
# Secrets (needed whenever the budget is > 0):
#   ADZUNA_APP_ID, ADZUNA_APP_KEY
# Optional variables:
#   CALL_PACE  seconds between calls (default 13, fits 5 calls/minute)
#   COUNTRIES  comma list (default de,ch; Austria left out)
#   MAX_DAYS_OLD  only fetch postings this new (default 14)

on:
  schedule:
    - cron: "0 6 * * *"        # 06:00 UTC
  workflow_dispatch:
    inputs:
      call_budget:
        description: "Max Adzuna API calls (0 = rebuild from snapshot, no API use)"
        default: "25"

permissions:
  contents: write

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Tests
        run: |
          pip install pytest==8.2.0
          pytest tests/ -q

      - name: Run pipeline
        env:
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          CALL_BUDGET: ${{ github.event_name == 'schedule' && (vars.DAILY_CALL_BUDGET || '0') || inputs.call_budget }}
          CALL_PACE: ${{ vars.CALL_PACE || '13' }}
          COUNTRIES: ${{ vars.COUNTRIES || 'de,ch' }}
          MAX_DAYS_OLD: ${{ vars.MAX_DAYS_OLD || '14' }}
        run: python src/pipeline.py

      - name: Keep raw API responses for a week
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raw-${{ github.run_id }}
          path: .cache/raw
          retention-days: 7
          if-no-files-found: ignore

      - name: Commit data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data state
          if git diff --cached --quiet; then
            echo "no changes"; exit 0
          fi
          git commit -m "data refresh $(date -u +%F)"
          git pull --rebase
          git push
