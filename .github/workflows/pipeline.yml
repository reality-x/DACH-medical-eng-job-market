name: pipeline

# Rebuilds docs/data/*.json from two sources:
#   - AI and data postings: the upstream tracker's published postings.json
#     (Chrisinho8/DACH-data-job-market). Free, no Adzuna calls.
#   - Software engineering postings: our own Adzuna queries, stored in
#     state/swe_postings.json.
#
# Daily schedule: CALL_BUDGET=0, so it merges fresh upstream data with
#   the stored SWE snapshot and never touches the Adzuna API.
# Manual run (Actions -> pipeline -> Run workflow): default budget 25
#   refreshes the SWE snapshot. 25 is the whole free-tier month.
#
# Secrets (only needed for manual runs with a budget):
#   ADZUNA_APP_ID, ADZUNA_APP_KEY
# Optional variable:
#   CALL_PACE  seconds between calls (default 13, fits 5 calls/minute)

on:
  schedule:
    - cron: "0 6 * * *"        # 06:00 UTC, after upstream publishes
  workflow_dispatch:
    inputs:
      call_budget:
        description: "Max Adzuna API calls (0 = merge only, no API use)"
        default: "25"

permissions:
  contents: write

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Tests
        run: |
          pip install pytest==8.2.0
          pytest tests/ -q

      - name: Run pipeline
        env:
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          CALL_BUDGET: ${{ github.event_name == 'schedule' && '0' || inputs.call_budget }}
          CALL_PACE: ${{ vars.CALL_PACE || '13' }}
        run: python src/pipeline.py

      - name: Keep raw API responses for a week
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raw-${{ github.run_id }}
          path: .cache/raw
          retention-days: 7
          if-no-files-found: ignore

      - name: Commit data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data state
          if git diff --cached --quiet; then
            echo "no changes"; exit 0
          fi
          git commit -m "data refresh $(date -u +%F)"
          git pull --rebase
          git push
